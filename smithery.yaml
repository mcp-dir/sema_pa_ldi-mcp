# Smithery configuration for SEMA PA: Lista de Desmatamento Ilegal do Pará (LDI)
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_sema_pa_ldi

name: sema_pa_ldi-mcp
displayName: "SEMA PA: Lista de Desmatamento Ilegal do Pará (LDI)"
description: >
  SEMA PA: Lista de Desmatamento Ilegal do Pará (LDI), consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/sema_pa_ldi-mcp
repository: https://github.com/mcp-dir/sema_pa_ldi-mcp

tags:
  - sema_pa_ldi
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_sema_pa_ldi

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_sema_pa_ldi/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
